name: NEXT-RA validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate application JavaScript syntax
        run: node --check assets/app.js
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check secure Admin Edge Functions
        run: deno check supabase/functions/admin-overview/index.ts supabase/functions/admin-trading-settings/index.ts
